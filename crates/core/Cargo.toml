[package]
name = "tellal-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tellal_core"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
# Voices (EMA Lightning, Supertonic 2): ONNX Runtime (prebuilt binaries fetched at build time) + Turkish text normalizer.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
normalizer-tr = "0.8.1"
unicode-normalization = "0.1.26"
regex = "1.13"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
libc = "0.2"
# Voice downloads: HTTPS with macOS's TLS and trust store, SHA-256 per file.
ureq = { version = "3.5.1", default-features = false, features = ["native-tls-no-default"] }
hmac-sha256 = "1.1.15"
