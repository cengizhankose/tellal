[package]
name = "t3-panel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "t3_panel_core"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
# 2.x dropped the built-in espeak-ng frontend, so Piper voices need an external phonemizer there.
sherpa-onnx = "=1.13.8"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
libc = "0.2"
